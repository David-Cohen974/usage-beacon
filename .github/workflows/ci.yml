name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test --jobs 1

      - name: Build app bundle
        run: ./Scripts/build-app.sh debug
